<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Admin | Kalam Arivalayam</title>
  <link rel="stylesheet" href="css/style.css?v=7"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main class="section admin-shell"><div class="container"><div class="admin-topbar"><h2>Sales Administration</h2><div class="admin-actions"><a class="btn-secondary" href="rental-admin.html">Rental dashboard</a><a class="btn-secondary" href="index.html">Home</a><button class="btn-ghost" id="logoutAdminBtn">Logout</button></div></div><div class="dashboard-stats" id="saleStats"></div><div class="admin-layout"><aside class="admin-sidebar"><h3>Manage</h3><a class="active" href="#">Sale Books</a><a href="#">Orders</a><a href="#">Stock</a><a href="#">Customers</a></aside><div class="content"><div class="panel"><h3>Add / Edit Sale Book</h3><form id="saleBookForm"><div class="form-grid"><div class="form-group"><label>Book ID</label><input id="saleBookId" required></div><div class="form-group"><label>Book Name</label><input id="saleBookName" required></div><div class="form-group"><label>Author</label><input id="saleBookAuthor" required></div><div class="form-group"><label>ISBN</label><input id="saleBookIsbn"></div><div class="form-group"><label>Category</label><select id="saleBookCategory"><option>Computer Science</option><option>Artificial Intelligence</option><option>Programming</option><option>Database</option><option>Networking</option><option>Business</option></select></div><div class="form-group full"><label>Description</label><textarea id="saleBookDescription" rows="3"></textarea></div><div class="form-group"><label>Original Price</label><input id="saleBookPrice" type="number" required></div><div class="form-group"><label>Discount %</label><input id="saleBookDiscount" type="number" value="0"></div><div class="form-group"><label>Stock</label><input id="saleBookStock" type="number" required></div><div class="form-group full"><label>Book Image</label><input id="saleBookImage" type="url" /></div></div><div class="form-actions"><button class="btn-primary" type="submit">Save Book</button><button class="btn-secondary" type="reset">Clear</button></div></form></div><div class="panel" style="margin-top:24px;"><h3>Manage Sale Books</h3><table><thead><tr><th>Book ID</th><th>Book</th><th>Author</th><th>Category</th><th>Price</th><th>Discount</th><th>Stock</th><th>Sales</th><th>Status</th><th>Actions</th></tr></thead><tbody id="saleBooksTable"></tbody></table></div><div class="panel" style="margin-top:24px;"><h3>Orders</h3><table><thead><tr><th>Order ID</th><th>Books</th><th>Amount</th><th>Payment Status</th><th>Order Status</th><th>Date</th><th>Action</th></tr></thead><tbody id="saleOrdersTable"></tbody></table></div></div></div></div></div></main>
  <script src="js/storage.js"></script>
  <script src="js/admin-sale.js"></script>
  <script src="js/site.js?v=9"></script>
</body>
</html>
