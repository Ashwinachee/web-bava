<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental Admin | Kalam Arivalayam</title>
  <link rel="stylesheet" href="css/style.css?v=7"><link rel="stylesheet" href="css/admin.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main class="section admin-shell"><div class="container"><div class="admin-topbar"><h2>Rental Administration</h2><div class="admin-actions"><a class="btn-secondary" href="sale-admin.html">Sales dashboard</a><a class="btn-secondary" href="index.html">Home</a><button class="btn-ghost" id="logoutAdminBtn">Logout</button></div></div><div class="dashboard-stats" id="rentalStats"></div><div class="admin-layout"><aside class="admin-sidebar"><h3>Manage</h3><a class="active" href="#">Rental Books</a><a href="#">Records</a><a href="#">Overdue</a><a href="#">Returned</a></aside><div class="content"><div class="panel"><h3>Add / Edit Rental Book</h3><form id="rentalBookForm"><div class="form-grid"><div class="form-group"><label>Book ID</label><input id="rentalBookId" required></div><div class="form-group"><label>Book Name</label><input id="rentalBookName" required></div><div class="form-group"><label>Author</label><input id="rentalBookAuthor" required></div><div class="form-group"><label>ISBN</label><input id="rentalBookIsbn"></div><div class="form-group"><label>Category</label><select id="rentalBookCategory"><option>Computer Science</option><option>Artificial Intelligence</option><option>Programming</option><option>Web Technology</option><option>Database</option><option>Networking</option><option>Mathematics</option></select></div><div class="form-group full"><label>Description</label><textarea id="rentalBookDescription" rows="3"></textarea></div><div class="form-group"><label>Rental Price</label><input id="rentalBookPrice" type="number" required></div><div class="form-group"><label>Security Deposit</label><input id="rentalSecurityDeposit" type="number" required></div><div class="form-group"><label>Total Copies</label><input id="rentalTotalCopies" type="number" required></div><div class="form-group"><label>Available Copies</label><input id="rentalAvailableCopies" type="number" required></div><div class="form-group full"><label>Book Image</label><input id="rentalBookImage" type="url" /></div></div><div class="form-actions"><button class="btn-primary" type="submit">Save Book</button><button class="btn-secondary" type="reset">Clear</button></div></form></div><div class="panel" style="margin-top:24px;"><h3>Manage Rental Books</h3><table><thead><tr><th>Book ID</th><th>Book Name</th><th>Author</th><th>Category</th><th>Rental Price</th><th>Total Copies</th><th>Available</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rentalBooksTable"></tbody></table></div><div class="panel" style="margin-top:24px;"><h3>Rental Records</h3><table><thead><tr><th>Rental ID</th><th>Student</th><th>Student ID</th><th>Book</th><th>Rental Date</th><th>Due Date</th><th>Return Date</th><th>Fine</th><th>Status</th></tr></thead><tbody id="rentalRecordsTable"></tbody></table></div></div></div></div></div></main>
  <script src="js/storage.js"></script>
  <script src="js/admin-rental.js"></script>
  <script src="js/site.js?v=9"></script>
</body>
</html>
